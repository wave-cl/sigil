name: ci

on:
  push:
  pull_request:

# One run per branch. A superseded run proves nothing and costs a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Everything that does not need a second platform: formatting, lints, and the
  # tests, on Linux.
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    steps:
      # One checkout. sigil pins the sqex crates to a git tag (v0.46.0), so
      # cargo fetches them like any other dependency -- there was a second
      # checkout beside this one for as long as they were path dependencies
      # into a worktree. sqex, sqnr and squic are all public, so CI needs no
      # secret and runs unchanged on a fork.
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: System dependencies
        run: |
          sudo apt-get update
          # cmake             libopus is built from source
          # libasound2-dev    cpal's ALSA backend, and the fallback with no PipeWire
          # libpipewire-0.3-dev  the preferred Linux audio backend
          # libgtk-3-dev      the tray speaks StatusNotifierItem through GTK,
          #                   even though sigil draws with wgpu
          # libpcsclite-dev   sqnr links a YubiKey signer through pcsc-sys.
          #                   sigil only ever uses a software identity -- a card
          #                   cannot be a transport key -- but the dependency is
          #                   unconditional, so the header is needed to build.
          # libxdo-dev        tray-icon uses libxdo to raise a window on X11.
          #
          # Both are *link*-time requirements, which is why Check and Clippy
          # passed without them and Tests did not: `cargo check` never links, so
          # it cannot see a missing system library. Only building catches these.
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libasound2-dev libpipewire-0.3-dev libgtk-3-dev \
            libpcsclite-dev libxdo-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libxcb1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets

      # Never `--all` here, and this is the repository that proves why.
      # `cargo fmt --all` formats the workspace *and the path-based
      # dependencies of its members*, and while the sqex crates were paths into
      # ../sqex-sigil that meant 868 sites written into another repository and
      # zero into this one, which was already clean. Not a thought experiment:
      # it is how 63 files of sqex were once reformatted by accident, from
      # here. Pinning to a git tag removed the hazard -- a fetched dependency
      # is not a workspace member -- but it removed it for as long as the pin
      # lasts, and co-developing against sqex means putting the paths back.
      #
      # The list stays for a reason the pin does not touch: it is *derived*, so
      # adding a crate cannot leave it silently unchecked with the job still
      # green, and it is echoed so a green run shows what it covered. Built as
      # a bash array because the unquoted `-p a -p b` form depends on word
      # splitting, which zsh does not do, so it cannot be tested on a dev
      # machine.
      - name: Format
        run: |
          args=()
          while read -r n; do args+=(-p "$n"); done \
            < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          test ${#args[@]} -gt 0
          echo "checking: ${args[*]}"
          cargo fmt "${args[@]}" -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Runs the real audio path: tone in, WAV out, through an in-process sqexd
      # and a real Opus encoder, with no sound hardware anywhere. That is the
      # Linux half of the call actually being exercised rather than assumed.
      - name: Tests
        run: scripts/run-tests

  # ---------------------------------------------------------------------------
  # The same, on macOS. It is half the supported platforms and the audio
  # backend is a different one.
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: scripts/run-tests
      # The bundle is not optional on macOS: notifications and the microphone
      # both depend on its Info.plist keys, and both fail silently without
      # them. Building it here catches a broken plist before somebody discovers
      # it as a call with no sound.
      - name: Build sigil.app
        run: |
          scripts/macos-app
          plutil -lint target/sigil.app/Contents/Info.plist
          for key in NSMicrophoneUsageDescription CFBundleIdentifier CFBundleURLTypes; do
            /usr/libexec/PlistBuddy -c "Print :$key" target/sigil.app/Contents/Info.plist >/dev/null \
              || { echo "::error::sigil.app is missing $key"; exit 1; }
          done

  # ---------------------------------------------------------------------------
  # Pixels. Rendered with a software rasterizer so the output is the same on
  # every machine; a GPU would give a different answer per runner.
  # ---------------------------------------------------------------------------
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libasound2-dev libpipewire-0.3-dev libgtk-3-dev \
            libpcsclite-dev libxdo-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libxcb1-dev \
            mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      - name: Snapshots
        run: scripts/snapshot-test

  # ---------------------------------------------------------------------------
  # The tick.
  #
  # This job exists because a green check can mean *nothing ran*. A matrix that
  # resolved empty, a path filter that excluded everything, a job skipped
  # because one it needed was skipped -- all of those are green, and none of
  # them checked anything.
  #
  # So this names every job that must have run and asserts each one *succeeded*
  # rather than merely not failing. `skipped` and `cancelled` are failures here.
  # ---------------------------------------------------------------------------
  complete:
    if: always()
    needs: [linux, macos, snapshots]
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have actually run
        run: |
          set -eu
          fail=0
          check() {
            printf '%-12s %s\n' "$1" "$2"
            [ "$2" = "success" ] || fail=1
          }
          check linux     "${{ needs.linux.result }}"
          check macos     "${{ needs.macos.result }}"
          check snapshots "${{ needs.snapshots.result }}"
          if [ "$fail" -ne 0 ]; then
            echo "::error::a required job did not run to success (skipped and cancelled count as failure)"
            exit 1
          fi
          echo "all required jobs ran and passed"
