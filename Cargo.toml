[workspace]
resolver = "2"
members = [
    "crates/sigil",
    "crates/sigil-ui",
    "crates/sigil-emoji",
    "crates/sigil-net",
    "crates/sigil-platform",
    "crates/sigil-voice",
    "crates/sigil-chat",
    "crates/sigil-video",
    "crates/sigil-admin",
    "crates/sigil-update",
    "crates/sigil-shell",
]

[workspace.package]
version = "0.1.47"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# --- the sqex stack -------------------------------------------------------
# Pinned to a tag, exactly as sqex pins squic and sqnr. That is what makes a
# release buildable from a clone: a tag whose manifest names a directory
# outside the repository can only be built on the machine that has one.
#
# **To co-develop against sqex**, point these at the worktree instead --
# `scripts/dev-worktree` creates it and says how -- and put the tag back before
# tagging a release. `.github/workflows/release.yml` refuses a tag that still
# carries a path dependency, so forgetting fails loudly rather than shipping
# something nobody else can build. See docs/dependencies.md.
sqex-proto = { git = "https://github.com/wave-cl/sqex", tag = "v0.113.0" }
sqex-discovery = { git = "https://github.com/wave-cl/sqex", tag = "v0.113.0" }
sqex-voice = { git = "https://github.com/wave-cl/sqex", tag = "v0.113.0" }
sqex-chat = { git = "https://github.com/wave-cl/sqex", tag = "v0.113.0" }
# Only ever a dev-dependency: tests drive a real exchange in-process, because a
# client that was only tested against a mock has tested the mock.
sqexd = { git = "https://github.com/wave-cl/sqex", tag = "v0.113.0" }
sqnr = { git = "https://github.com/wave-cl/sqnr", tag = "v0.10.10" }
sqnr-core = { git = "https://github.com/wave-cl/sqnr", tag = "v0.10.10" }
squic = { git = "https://github.com/wave-cl/squic-rust", tag = "v0.27.0" }

# --- gui ------------------------------------------------------------------
# Upstream egui, not notedeck's damus-io forks. 0.36 moved eframe::App to a
# `logic`/`ui` split, where `logic` runs even while the window is hidden --
# which is what lets a call keep running when sigil is closed to the tray.
# `links` is in eframe's defaults and those are off here, so it has to be
# named: without it `egui-winit` compiles `open_url_in_browser` to a log line
# and **every link in sigil is a dead control**. The update check offers "See
# the release" and "What changed"; both did nothing, on every platform, in
# silence. `the_links_feature_is_on` asserts the crate that does the opening
# is in the graph.
eframe = { version = "0.36", default-features = false, features = [
    "wgpu",
    "wayland",
    "x11",
    "links",
] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["all_loaders"] }
egui-wgpu = "0.36"
# The same version eframe carries, so `eframe::Frame`'s handle is the type this
# crate's trait is implemented for. Used for one thing: asking macOS how large
# the window's own buttons are, since sigil draws behind them.
raw-window-handle = "0.6.2"

# --- desktop integration --------------------------------------------------
tray-icon = "0.24"
global-hotkey = "0.8"
notify-rust = "4"
rfd = "0.17"
auto-launch = "0.6"

# --- runtime --------------------------------------------------------------
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
bs58 = "0.5"
image = { version = "0.25", features = ["gif", "jpeg", "png", "webp"] }
libc = "0.2"

[workspace.dependencies.egui_kittest]
version = "0.36"
features = ["wgpu", "snapshot"]

[profile.release]
# Thin, not fat, and the default codegen units. Fat LTO with one codegen unit
# made the final crate alone take 6.5 of the Intel runner's 13 minutes (131 s
# against 26 s on an M-series laptop, 2026-09-20), for a binary a third
# smaller (33 MB against 44) and no difference anybody could measure in an
# egui chat client. The link is the one step no cache can carry, so it is the
# one worth making cheap.
lto = "thin"

