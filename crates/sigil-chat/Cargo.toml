[package]
name = "sigil-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Messaging as a sigil App."

[dependencies]
egui = { workspace = true }
bs58 = { workspace = true }
image = { workspace = true }
sigil = { path = "../sigil" }
sigil-ui = { path = "../sigil-ui" }
sigil-video = { path = "../sigil-video" }
sqex-chat = { workspace = true }
sqnr-core = { workspace = true }
sqnr = { workspace = true }
sqex-proto = { workspace = true }
sqex-voice = { workspace = true }
sigil-net = { path = "../sigil-net" }
dirs = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
# SIP-42: the ephemeral offered when opening a session toward one of this
# account's other devices. The same pair sigil-net uses for direct calls.
x25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }

# The native file dialog. A phone has none -- choosing there is an activity
# the platform runs -- so the host installs a chooser instead; see `files`.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
sigil-emoji = { path = "../sigil-emoji" }
sqexd = { workspace = true }
squic = { workspace = true }
tempfile = "3"
# The exchange's own request counter, read from `/status`, is the only place
# the traffic two idle clients make is visible.
serde_json = "1"
toml = "0.8"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
# For `examples/quic_stats`, which reads quinn's path statistics off a raw
# connection: the one place the transport's window, loss and RTT are visible.
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = "0.11"
http = "1"
bytes = "1"
