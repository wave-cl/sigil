[package]
name = "sigil-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The connection actor: owns a sqnr::Client, demultiplexes datagrams by session id, carries the ring listener."

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
sqnr = { workspace = true }
sqnr-core = { workspace = true }
sqex-proto = { workspace = true }
x25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
sqex-discovery = { workspace = true }
sqex-voice = { workspace = true }

[dev-dependencies]
sqexd = { workspace = true }
squic = { workspace = true }
tempfile = "3"
toml = "0.8"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sqex-chat = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
