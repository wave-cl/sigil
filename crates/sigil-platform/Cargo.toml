[package]
name = "sigil-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop capabilities: tray, notifications, hotkeys, deep links -- each reporting whether this desktop supports it."

[dependencies]
tracing = { workspace = true }
tray-icon = { workspace = true }
global-hotkey = { workspace = true }
notify-rust = { workspace = true }
auto-launch = { workspace = true }
image = { workspace = true }
sigil = { path = "../sigil" }
sqnr-core = { workspace = true }
rfd = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSDockTile",
    "NSResponder",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# The tray is GTK on Linux and wants its own loop on its own thread; the
# version tray-icon already links.
gtk = "0.18"

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3"
