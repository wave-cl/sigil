[package]
name = "sigil-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop capabilities: tray, notifications, hotkeys, deep links -- each reporting whether this desktop supports it."

[dependencies]
tracing = { workspace = true }
image = { workspace = true }
sigil = { path = "../sigil" }
sqnr-core = { workspace = true }
libc = { workspace = true }

# The desktop itself. None of it exists on a phone: a tray, a global
# shortcut, a login item and a notification daemon are all things a desktop
# has, and every one of these links something Android does not ship. There
# the module reports `Support::No` with the reason, and sigil-android posts
# its own notifications through the platform. See build.rs for the
# `linux_desktop` cfg the modules select the GTK and D-Bus arms with.
[target.'cfg(not(target_os = "android"))'.dependencies]
tray-icon = { workspace = true }
global-hotkey = { workspace = true }
notify-rust = { workspace = true }
auto-launch = { workspace = true }
rfd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSNotification",
    "NSOperation",
    "block2",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSDockTile",
    "NSResponder",
] }
block2 = "0.6"
# How long since the last keypress or click anywhere on this desktop, for
# saying "away". Already in the lock through the clipboard crate.
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGEventSource",
    "CGEventTypes",
] }

[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# The tray is GTK on Linux and wants its own loop on its own thread; the
# version tray-icon already links.
gtk = "0.18"

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3"
