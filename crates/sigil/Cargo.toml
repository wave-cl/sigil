[package]
name = "sigil"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The sigil host: App trait, AppContext, navigation, theme, settings."

[dependencies]
egui = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
sqnr-core = { workspace = true }
sqnr = { workspace = true }
# For `Connections`: what an app reaches an exchange through. The dependency is
# one way -- sigil-net knows nothing about windows.
sigil-net = { path = "../sigil-net" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = { workspace = true }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
hex = "0.4"
egui_kittest = { workspace = true }
